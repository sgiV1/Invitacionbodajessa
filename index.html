<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Boda — Daniel & Jezabel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-primary: #BF953F;
            --gold-light: #FCF6BA;
            --gold-medium: #B38728;
            --gold-dark: #AA771C;
            --bg-cream: #FAF8F5;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-cream);
            color: #211f1c;
            overflow-x: hidden;
        }

        .font-serif-custom { font-family: 'Cinzel', serif; }
        
        .gold-gradient-text {
            background: linear-gradient(135deg, #8C6D2B 0%, #D4AF37 30%, #9A7B38 65%, #594214 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .botanical-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(212, 175, 55, 0.35);
            box-shadow: 0 20px 50px rgba(180, 140, 50, 0.08), 0 4px 15px rgba(0, 0, 0, 0.02);
            position: relative;
        }

        .gold-btn-primary {
            background: linear-gradient(135deg, #BF953F 0%, #E6C675 40%, #D4AF37 70%, #AA771C 100%);
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.15em;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 20px rgba(191, 149, 63, 0.3);
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .gold-btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.45);
        }

        .btn-luxury-gold {
            background: linear-gradient(135deg, #BF953F 0%, #E6C675 40%, #D4AF37 70%, #AA771C 100%);
            color: #ffffff;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(191, 149, 63, 0.3);
        }

        .view-wrapper {
            transition: max-width 0.5s ease-in-out;
        }

        .view-mobile {
            max-width: 440px !important;
            margin: 0 auto;
        }

        .view-desktop {
            max-width: 720px !important;
            margin: 0 auto;
        }

        .modal-overlay {
            background: rgba(12, 12, 12, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center relative select-none">

    <div id="deviceModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay transition-all duration-500">
        <div class="max-w-md w-full bg-stone-900/95 border border-amber-500/40 rounded-3xl p-8 text-center shadow-2xl text-white space-y-6 transform scale-100 transition-all relative overflow-hidden">
            
            <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-amber-600/20 to-amber-300/20 border border-amber-400/40 flex items-center justify-center mx-auto text-amber-300 text-2xl shadow-inner">
                ✨
            </div>
            
            <div class="space-y-2">
                <h3 class="font-serif-custom text-2xl font-bold text-amber-200 tracking-wide">Elige tu Experiencia</h3>
                <p class="text-xs text-stone-300 font-light leading-relaxed">
                    Selecciona cómo deseas visualizar la invitación durante toda tu navegación:
                </p>
            </div>

            <div class="grid grid-cols-2 gap-4 pt-2">
                <button onclick="setMode('mobile')" class="p-5 rounded-2xl bg-stone-800/80 border border-amber-500/30 hover:border-amber-400 transition text-center space-y-3 group hover:bg-stone-800">
                    <div class="text-3xl group-hover:scale-110 transition-transform duration-300">📱</div>
                    <div>
                        <div class="text-xs font-semibold text-amber-300">Modo Móvil</div>
                        <div class="text-[10px] text-stone-400 font-light mt-0.5">Pantalla Celular</div>
                    </div>
                </button>

                <button onclick="setMode('desktop')" class="p-5 rounded-2xl bg-stone-800/80 border border-amber-500/30 hover:border-amber-400 transition text-center space-y-3 group hover:bg-stone-800">
                    <div class="text-3xl group-hover:scale-110 transition-transform duration-300">💻</div>
                    <div>
                        <div class="text-xs font-semibold text-amber-300">Modo Escritorio</div>
                        <div class="text-[10px] text-stone-400 font-light mt-0.5">Vista Panorámica</div>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <div class="fixed bottom-6 right-6 z-40">
        <button onclick="toggleDeviceModal()" class="btn-luxury-gold p-3.5 rounded-full shadow-2xl flex items-center space-x-2 text-xs font-bold border border-white/50">
            <span id="currentModeIcon" class="text-base">📱</span>
            <span class="hidden sm:inline uppercase tracking-widest text-[10px]" id="currentModeText">Cambiar Vista</span>
        </button>
    </div>

    <div class="fixed inset-0 pointer-events-none z-0">
        <canvas id="heroCanvas" class="w-full h-full block"></canvas>
    </div>

    <div class="z-10 w-full min-h-screen flex flex-col justify-between items-center px-4 py-8">
        
        <header class="text-center pt-6 opacity-0 animate-[fadeIn_1s_0.2s_forwards]">
            <p class="text-amber-800/80 tracking-[0.3em] text-[10px] sm:text-xs uppercase font-semibold font-serif-custom">Nuestra Unión Matrimonial</p>
        </header>

        <main id="mainWrapper" class="w-full view-wrapper my-auto text-center px-6 py-12 rounded-[2.5rem] botanical-card shadow-2xl relative overflow-hidden my-6">
            <div class="absolute top-4 left-4 w-6 h-6 border-t-2 border-l-2 border-amber-500/40"></div>
            <div class="absolute top-4 right-4 w-6 h-6 border-t-2 border-r-2 border-amber-500/40"></div>
            <div class="absolute bottom-4 left-4 w-6 h-6 border-b-2 border-l-2 border-amber-500/40"></div>
            <div class="absolute bottom-4 right-4 w-6 h-6 border-b-2 border-r-2 border-amber-500/40"></div>

            <p class="text-amber-800/90 tracking-[0.25em] text-xs uppercase mb-6 font-semibold">Estás cordialmente invitado</p>

            <h1 class="font-serif-custom text-4xl sm:text-6xl font-extrabold gold-gradient-text tracking-wide leading-tight my-4">
                Daniel Guzmán<br>
                <span class="text-2xl sm:text-3xl font-light text-stone-400 block my-2">&</span>
                Jezabel Guerrero
            </h1>

            <div class="w-24 h-[1px] bg-gradient-to-r from-transparent via-amber-400 to-transparent mx-auto my-6 opacity-70"></div>

            <p class="text-stone-600 text-xs sm:text-sm tracking-[0.2em] uppercase font-medium mb-8">
                20 DE DICIEMBRE • AGUASCALIENTES, AGS.
            </p>

            <div>
                <a href="invitacion.html" class="gold-btn-primary px-10 py-5 rounded-full inline-block uppercase text-xs tracking-[0.2em]">
                    Ver Invitación
                </a>
            </div>
        </main>

        <footer class="text-center pb-4 text-[10px] text-stone-400 tracking-[0.2em] font-medium font-serif-custom">
            DANIEL & JEZABEL 2026
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('heroCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height + canvas.height;
                this.size = Math.random() * 2.8 + 0.8;
                this.speedY = Math.random() * 0.7 + 0.2;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.65 + 0.25;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                if (this.y < -10) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(191, 149, 63, ${this.opacity})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < 180; i++) {
            const p = new Particle();
            p.y = Math.random() * canvas.height;
            particles.push(p);
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        function applyViewMode(mode) {
            const wrapper = document.getElementById('mainWrapper');
            const icon = document.getElementById('currentModeIcon');
            if (mode === 'mobile') {
                wrapper.classList.remove('view-desktop');
                wrapper.classList.add('view-mobile');
                icon.innerText = '📱';
            } else {
                wrapper.classList.remove('view-mobile');
                wrapper.classList.add('view-desktop');
                icon.innerText = '💻';
            }
        }

        function setMode(mode) {
            localStorage.setItem('weddingViewMode', mode);
            applyViewMode(mode);
            const modal = document.getElementById('deviceModal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => modal.classList.add('hidden'), 500);
        }

        function toggleDeviceModal() {
            const modal = document.getElementById('deviceModal');
            modal.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedMode = localStorage.getItem('weddingViewMode');
            const modal = document.getElementById('deviceModal');
            if (savedMode) {
                applyViewMode(savedMode);
                modal.classList.add('hidden', 'opacity-0', 'pointer-events-none');
            }
        });
    </script>
</body>
</html>
